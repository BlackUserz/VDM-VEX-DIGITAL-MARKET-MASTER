<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEX Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class=top><nav class=nav><button class=icon onclick="location.href='index.html'">←</button><div class=brand><img src=assets/vdm-mark.svg><span>VEX DIGITAL MARKET<small>ADMIN PANEL</small></span></div></nav></header><main class=page><div class=back><button onclick="location.href='index.html'">⤶ Kembali</button></div><h1>Admin Panel</h1><div class=kpis><div class=kpi><span>Produk</span><strong>19</strong></div><div class=kpi><span>Pesanan</span><strong id=o>0</strong></div><div class=kpi><span>Pending</span><strong id=p>0</strong></div><div class=kpi><span>Revenue</span><strong id=r>Rp 0</strong></div></div><div style="margin:20px 0"><button class=btn onclick="alert('Form tambah produk akan dihubungkan ke database production.')">+ Tambah Produk</button></div><table><tr><th>Produk</th><th>Kategori</th><th>Paket</th><th>Harga</th><th>Status</th><th>Aksi</th></tr><tbody id=t></tbody></table></main><script>const P='+JSON.stringify([["Viu Premium","Streaming","1 BULAN PREMIUM","Rp 10.000"],["YouTube Premium","Streaming","1 BULAN INDIVIDUAL","Rp 15.000"],["Netflix Premium","Streaming","1 BULAN SHARING (1U)","Rp 42.000"],["iQIYI Premium","Streaming","1 BULAN PRIVATE (PREMIUM)","Rp 40.000"],["Canva Pro","Design","1 BULAN","Rp 10.000"],["CapCut Pro","Editing","1 BULAN","Rp 15.000"]])+';let O=JSON.parse(localStorage.vex_orders||"[]");o.textContent=O.length;p.textContent=O.filter(x=>x.status==="PENDING").length;r.textContent="Rp "+new Intl.NumberFormat("id-ID").format(O.reduce((a,x)=>a+x.total,0));t.innerHTML=P.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><span class=status>Aktif</span></td><td><button onclick="alert('Editor produk production akan menyimpan ke database.')">Edit</button></td></tr>`).join("")</script></body></html>
